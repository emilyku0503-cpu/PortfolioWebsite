<!DOCTYPE html>
<html lang="en">

<head>

    <title>Yeonji Ku | Portfolio</title>
    <meta name="description" content="Portfolio website for Yeonji Ku, a 3D artist." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
    <main class="page page-home">
        <header class="hero-section" aria-labelledby="hero-title">

                <h1 id="hero-title" class="hero-title">Hi, I’m Yeonji Ku<br />a 3D Artist.</h1>

                <img class="hero-image" class="hero-image" src="assets/images/hero.png" alt="3D artwork" />
            </div>
        </header>

        <section class="portfolio-section" aria-labelledby="portfolio-title">
            <header class="section-header">
                <h2 id="portfolio-title" class="section-title">Portfolio</h2>
            </header>

            <div class="project-grid">
                <article class="project-card">
                    <a href="project.html?project=cafe" class="card-content">

                        <img class="card-image" data-project-image="cafe" alt="" />

                        <span class="card-dim"></span>

                        <span class="card-title" data-project-title="cafe">
                        </span>

                </article>

                <article class="project-card">
                    <a href="project.html?project=scillica" class="card-content">

                <article class="project-card">
                    <a href="project.html?project=inova" class="card-content">

                        <img class="card-image" data-project-image="inova" alt="" />

                        <span class="card-dim"></span>

                        <span class="card-title" data-project-title="inova">
                        </span>

                    </a>
                </article>

                <article class="project-card">
                    <a href="project.html?project=self-portrait" class="card-content">

                        <img class="card-image" data-project-image="self-portrait" alt="" />

                        <span class="card-dim"></span>

                        <span class="card-title" data-project-title="self-portrait">
                        </span>

                    </a>
                </article>
            </div>
        </section>

        <footer class="site-footer" aria-labelledby="footer-title">
            <div class="footer-header">
                <h2 id="footer-title" class="footer-title">Let’s Connect.</h2>
                <a href="assets/resume/Yeonji Ku_Resume.pdf" target="_blank" rel="noopener noreferrer"
                    class="footer-link">Download Resume</a>
            </div>

            <div class="social-links" aria-label="Social links">
                <a class="social-link" href="mailto:emilyku0503@gmail.com" aria-label="Email">
                    <img class="social-icon" src="assets/images/mail.png" alt="" />
                </a>

                <a class="social-link" href="https://www.linkedin.com/in/yeonji-ku-b78782308" aria-label="LinkedIn">
                    <img class="social-icon" src="assets/images/linkedin.png" alt="" />

    <script src="script.js"></script>
